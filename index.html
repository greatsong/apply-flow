<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에듀플로 베타 테스터 모집</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
</head>
<body>

  <!-- 배경 블롭 장식 -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="container">
    <!-- 헤더 -->
    <header class="header" id="header">
      <div class="logo">
        <div class="logo-icon">📚</div>
        <span class="logo-text">EduFlow</span>
      </div>
      <h1>베타 테스터 모집</h1>
      <p>AI와 함께 교재를 만드는 새로운 경험, 에듀플로의 첫 번째 여정에 함께하세요.</p>
    </header>

    <!-- 마감 배너 -->
    <div class="deadline-banner" id="deadlineBanner">
      ⏰ 모집 마감: <span id="deadlineDate">로딩 중...</span>
    </div>

    <!-- 진행률 바 -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- 채팅 영역 -->
    <div class="chat-area" id="chatArea"></div>

    <!-- 입력 영역 (동적으로 변경됨) -->
    <div id="inputArea"></div>

    <!-- 하단 -->
    <footer class="footer">
      Powered by <a href="https://eduflow-greatsong.fly.dev" target="_blank">EduFlow</a> · 제작: 석리송
    </footer>
  </div>

  <script src="js/chat-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
